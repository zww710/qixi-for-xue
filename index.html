<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#140a22">
<meta name="description" content="陈维雪，七夕快乐。">
<title>陈维雪 · 七夕快乐</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STKaiti", "KaiTi", serif;
  color: #fff;
  background: linear-gradient(180deg, #0b0716 0%, #1a0e2b 34%, #32142f 62%, #4d1936 84%, #6e2140 100%);
}

#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.moon {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 26px);
  right: 24px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  z-index: 1;
  background:
    radial-gradient(circle at 34% 32%, rgba(255, 250, 235, 0.98), rgba(255, 236, 205, 0.9) 46%, rgba(240, 205, 160, 0.75) 100%);
  box-shadow: 0 0 34px 10px rgba(255, 220, 170, 0.28), inset -8px -10px 18px rgba(190, 150, 110, 0.28);
}

.moon::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 18px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgba(180, 140, 100, 0.35);
}

.moon::after {
  content: "";
  position: absolute;
  right: 10px;
  bottom: 12px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(180, 140, 100, 0.3);
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.top {
  position: relative;
  z-index: 3;
  text-align: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 22px);
}

.kicker {
  font-size: 14px;
  letter-spacing: 0.55em;
  text-indent: 0.55em;
  color: #e9c896;
  opacity: 0.92;
  margin-bottom: 10px;
}

.name {
  font-family: "STKaiti", "KaiTi", "PingFang SC", serif;
  font-size: 46px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #fff;
  text-shadow: 0 0 20px rgba(255, 122, 162, 0.6), 0 2px 14px rgba(0, 0, 0, 0.35);
}

.festival {
  margin-top: 10px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  background: linear-gradient(90deg, #f8ddb1, #ffb0c2 55%, #ffd3b6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sub {
  margin-top: 12px;
  font-size: 14px;
  letter-spacing: 0.22em;
  color: rgba(255, 235, 242, 0.78);
}

.bouquet-area {
  flex: 1;
  width: 100%;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.bouquet {
  position: relative;
  width: 420px;
  height: 680px;
  transform-origin: center;
  will-change: transform;
  filter: drop-shadow(0 26px 44px rgba(0, 0, 0, 0.38));
}

.bouquet-glow {
  position: absolute;
  left: 50%;
  top: 26%;
  width: 86%;
  height: 58%;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(255, 160, 190, 0.3), rgba(255, 160, 190, 0.08) 55%, transparent 75%);
  filter: blur(14px);
  z-index: 0;
  pointer-events: none;
}

.wrap-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  overflow: visible;
}

.flower-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.fpos {
  position: absolute;
  transform: translate(-50%, -50%);
}

.flower {
  position: relative;
  width: var(--size);
  height: var(--size);
  transform-origin: 50% 86%;
  animation: sway var(--sway, 6s) ease-in-out infinite alternate;
}

@keyframes sway {
  from {
    transform: rotate(-1.6deg);
  }
  to {
    transform: rotate(1.6deg);
  }
}

.petal,
.sepal {
  position: absolute;
  left: 50%;
  bottom: 50%;
  transform-origin: 50% 100%;
  transform: rotate(var(--a)) scale(0.4, 0.24);
  opacity: 0.45;
  transition: transform 1.5s cubic-bezier(0.18, 1.12, 0.3, 1) var(--d, 0s), opacity 0.9s ease var(--d, 0s);
}

.p-out {
  width: 46%;
  height: 63%;
  margin-left: -23%;
  border-radius: 46% 46% 42% 42% / 76% 76% 26% 26%;
  background: radial-gradient(circle at 50% 24%, var(--light), var(--mid) 56%, var(--dark) 100%);
  box-shadow: inset 0 -8px 14px rgba(112, 0, 44, 0.3), inset 0 3px 8px rgba(255, 255, 255, 0.5);
}

.p-mid {
  width: 36%;
  height: 50%;
  margin-left: -18%;
  border-radius: 48% 48% 44% 44% / 78% 78% 28% 28%;
  background: radial-gradient(circle at 50% 26%, var(--light), var(--mid) 58%, var(--dark) 100%);
  box-shadow: inset 0 -7px 12px rgba(112, 0, 44, 0.34), inset 0 3px 7px rgba(255, 255, 255, 0.44);
}

.p-in {
  width: 26%;
  height: 37%;
  margin-left: -13%;
  border-radius: 50% 50% 46% 46% / 80% 80% 30% 30%;
  background: radial-gradient(circle at 50% 28%, var(--light), var(--mid) 60%, var(--dark) 100%);
  box-shadow: inset 0 -6px 10px rgba(90, 0, 40, 0.4), inset 0 3px 6px rgba(255, 255, 255, 0.36);
}

.p-bud {
  width: 32%;
  height: 44%;
  margin-left: -16%;
  border-radius: 50% 50% 44% 44% / 82% 82% 26% 26%;
  background: radial-gradient(circle at 50% 24%, var(--light), var(--mid) 58%, var(--dark) 100%);
  box-shadow: inset 0 -8px 14px rgba(110, 0, 45, 0.42), inset 0 3px 7px rgba(255, 255, 255, 0.4);
}

.sepal {
  width: 22%;
  height: 26%;
  margin-left: -11%;
  border-radius: 70% 30% 55% 45% / 45% 60% 40% 55%;
  background: linear-gradient(160deg, #5a9f5d, #245c2b);
  box-shadow: inset 0 -4px 8px rgba(12, 60, 20, 0.55);
}

.core {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 15%;
  height: 15%;
  margin: -7.5% 0 0 -7.5%;
  border-radius: 50%;
  z-index: 3;
  background: radial-gradient(circle at 40% 32%, #ffd7e0, #d81b60 58%, #741038);
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.38), 0 2px 9px rgba(90, 0, 40, 0.38);
  opacity: 0.72;
  transform: scale(0.45);
  transition: transform 1.1s cubic-bezier(0.18, 1.15, 0.3, 1) var(--d, 0s), opacity 0.9s ease var(--d, 0s);
}

body.bloomed .petal {
  transform: rotate(var(--a));
  opacity: 0.96;
}

body.bloomed .flower.bud .petal {
  transform: rotate(var(--a)) scale(0.88, 0.74);
  opacity: 0.92;
}

body.bloomed .sepal {
  transform: rotate(var(--a)) scale(1);
  opacity: 0.95;
}

body.bloomed .core {
  transform: scale(1);
  opacity: 1;
}

.bottom {
  position: relative;
  z-index: 3;
  text-align: center;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  min-height: 74px;
}

.tap-hint {
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.08em;
  color: #ffe9ef;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 999px;
  padding: 11px 24px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.tap-hint .heart {
  display: inline-block;
  color: #ff86a8;
  margin-right: 4px;
  animation: beat 1.4s ease-in-out infinite;
}

@keyframes beat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
}

.after-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
  font-size: 14px;
  letter-spacing: 0.18em;
  color: rgba(255, 226, 236, 0.92);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s;
  pointer-events: none;
}

body.bloomed .tap-hint {
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
}

body.bloomed .after-line {
  opacity: 1;
  transform: translateY(0);
}

.letter-mask {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(12, 5, 20, 0.44);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.55s ease;
}

.letter-mask.show {
  opacity: 1;
  pointer-events: auto;
}

.letter {
  position: relative;
  width: min(520px, 92vw);
  max-height: min(82vh, 640px);
  overflow-y: auto;
  overscroll-behavior: contain;
  border-radius: 8px;
  background: linear-gradient(160deg, #fdf4e3, #f6e2c4);
  color: #4a2a2a;
  padding: 34px 30px 28px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.48);
  transform: translateY(26px) scale(0.96);
  transition: transform 0.7s cubic-bezier(0.18, 1.2, 0.3, 1);
}

.letter-mask.show .letter {
  transform: translateY(0) scale(1);
}

.letter-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: rgba(74, 42, 42, 0.08);
  color: #6b4030;
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
}

.seal {
  width: 66px;
  height: 66px;
  margin: 0 auto 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "STKaiti", "KaiTi", serif;
  font-size: 21px;
  letter-spacing: 0.12em;
  color: #ffe6c8;
  background: radial-gradient(circle at 32% 28%, #ff7d98, #c81c4e 62%, #7c0f37);
  box-shadow: 0 6px 14px rgba(120, 10, 40, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.32);
  transform: rotate(-4deg);
}

.letter h3 {
  text-align: center;
  font-family: "STKaiti", "KaiTi", "PingFang SC", serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.14em;
  margin-bottom: 20px;
}

.letter p {
  font-size: 16px;
  line-height: 2;
  letter-spacing: 0.04em;
}

.letter p + p {
  margin-top: 10px;
}

.sign {
  text-align: right;
  margin-top: 20px;
  color: #6b4030;
}

.replay {
  display: flex;
  justify-content: center;
  margin-top: 24px;
}

.replay button {
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.1em;
  color: #fff;
  background: linear-gradient(90deg, #d84568, #b81c4e);
  border: none;
  border-radius: 999px;
  padding: 11px 26px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(180, 20, 70, 0.35);
}

.falling {
  position: fixed;
  top: -40px;
  z-index: 6;
  border-radius: 70% 30% 60% 40% / 60% 40% 70% 30%;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translate3d(0, -20px, 0) rotate(0deg);
    opacity: 0;
  }
  8% {
    opacity: 0.9;
  }
  100% {
    transform: translate3d(var(--dx, 0px), 112vh, 0) rotate(var(--rot, 420deg));
    opacity: 0;
  }
}

.spark {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  z-index: 7;
  pointer-events: none;
  background: radial-gradient(circle, #fff, #ffd9a0 60%, rgba(255, 190, 120, 0));
  box-shadow: 0 0 12px 3px rgba(255, 220, 160, 0.8);
  animation: spark 0.95s ease-out forwards;
}

@keyframes spark {
  from {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  to {
    transform: translate(var(--dx, 40px), var(--dy, -60px)) scale(0.1);
    opacity: 0;
  }
}

@media (max-width: 480px) {
  .moon {
    width: 48px;
    height: 48px;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    right: 16px;
  }

  .top {
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  }

  .name {
    font-size: 38px;
  }

  .festival {
    font-size: 19px;
  }

  .sub {
    font-size: 13px;
    margin-top: 10px;
  }

  .letter {
    padding: 28px 20px 24px;
  }

  .letter p {
    font-size: 15px;
    line-height: 1.95;
  }

  .letter h3 {
    font-size: 20px;
  }
}

@media (max-height: 760px) {
  .top {
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  }

  .kicker {
    margin-bottom: 6px;
  }

  .festival {
    margin-top: 6px;
  }

  .sub {
    margin-top: 8px;
  }

  .bottom {
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    min-height: 58px;
  }

  .after-line {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<div class="scene">
  <header class="top">
    <p class="kicker">献给</p>
    <h1 class="name">陈维雪</h1>
    <p class="festival">七夕快乐</p>
    <p class="sub">一束不会凋谢的电子花</p>
  </header>

  <div class="bouquet-area" id="bouquetArea">
    <div class="bouquet" id="bouquet">
      <div class="bouquet-glow" aria-hidden="true"></div>
      <svg class="wrap-svg" viewBox="0 0 420 680" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f9e9c7"/>
            <stop offset="0.55" stop-color="#e6c38d"/>
            <stop offset="1" stop-color="#b98a55"/>
          </linearGradient>
          <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff86a0"/>
            <stop offset="0.5" stop-color="#e83e70"/>
            <stop offset="1" stop-color="#a0184d"/>
          </linearGradient>
          <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5aa661"/>
            <stop offset="1" stop-color="#25622f"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#67ab69"/>
            <stop offset="1" stop-color="#2b6433"/>
          </linearGradient>
          <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ff9fb8" stop-opacity="0.55"/>
            <stop offset="0.6" stop-color="#ff9fb8" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#ff9fb8" stop-opacity="0"/>
          </radialGradient>
          <g id="leaf">
            <path d="M0 0 C 28 -7 52 -2 60 12 C 49 24 17 20 0 0 Z" fill="url(#leafGrad)" stroke="#1e4d26" stroke-width="1.4"/>
            <path d="M0 0 C 23 0 42 4 55 11" stroke="#1e4d26" stroke-width="1.1" fill="none" opacity="0.5"/>
          </g>
        </defs>

        <ellipse cx="210" cy="245" rx="190" ry="170" fill="url(#glowGrad)"/>

        <g fill="none" stroke-linecap="round">
          <g stroke="#163c1e" stroke-width="8" opacity="0.4">
            <path d="M210 130 C 210 240 207 380 205 512"/>
            <path d="M126 272 C 140 350 160 430 178 510"/>
            <path d="M294 252 C 280 340 258 430 240 510"/>
            <path d="M155 62 C 162 160 178 320 192 508"/>
            <path d="M265 48 C 256 160 238 320 226 508"/>
            <path d="M71 408 C 100 440 136 480 164 510"/>
            <path d="M349 394 C 318 432 280 478 254 510"/>
            <path d="M97 490 C 122 500 146 506 172 510"/>
            <path d="M323 476 C 298 494 274 502 248 510"/>
          </g>
          <g stroke="url(#stem)" stroke-width="5.2">
            <path d="M210 130 C 210 240 207 380 205 512"/>
            <path d="M126 272 C 140 350 160 430 178 510"/>
            <path d="M294 252 C 280 340 258 430 240 510"/>
            <path d="M155 62 C 162 160 178 320 192 508"/>
            <path d="M265 48 C 256 160 238 320 226 508"/>
            <path d="M71 408 C 100 440 136 480 164 510"/>
            <path d="M349 394 C 318 432 280 478 254 510"/>
            <path d="M97 490 C 122 500 146 506 172 510"/>
            <path d="M323 476 C 298 494 274 502 248 510"/>
          </g>
        </g>

        <use href="#leaf" transform="translate(206 330) rotate(-30) scale(1.05)"/>
        <use href="#leaf" transform="translate(208 425) rotate(155) scale(0.88)"/>
        <use href="#leaf" transform="translate(150 380) rotate(24) scale(0.78)"/>
        <use href="#leaf" transform="translate(272 365) rotate(-24) scale(0.78)"/>
        <use href="#leaf" transform="translate(173 220) rotate(-18) scale(0.68)"/>
        <use href="#leaf" transform="translate(248 205) rotate(18) scale(0.68)"/>
        <use href="#leaf" transform="translate(122 452) rotate(30) scale(0.66)"/>
        <use href="#leaf" transform="translate(300 442) rotate(-30) scale(0.66)"/>

        <path d="M158 514 C 182 504 238 504 262 514 L 336 666 C 322 692 98 692 84 666 Z" fill="url(#paper)"/>
        <path d="M184 511 L136 674" stroke="#a97843" stroke-width="2" opacity="0.35" fill="none"/>
        <path d="M236 511 L284 674" stroke="#a97843" stroke-width="2" opacity="0.28" fill="none"/>
        <path d="M210 508 L210 682" stroke="#a97843" stroke-width="2" opacity="0.3" fill="none"/>
        <path d="M166 670 Q 210 682 254 670" stroke="#fff7e0" stroke-width="3" fill="none" opacity="0.5"/>

        <path d="M104 552 L316 552 L328 584 L92 584 Z" fill="url(#ribbon)"/>
        <path d="M104 552 L316 552 L316 558 L104 558 Z" fill="#ffd6df" opacity="0.45"/>
        <path d="M112 575 L308 575 L316 584 L104 584 Z" fill="#7c103f" opacity="0.28"/>

        <g>
          <ellipse cx="184" cy="548" rx="38" ry="24" transform="rotate(-26 184 548)" fill="url(#ribbon)" stroke="#8d1144" stroke-width="1.4"/>
          <ellipse cx="236" cy="548" rx="38" ry="24" transform="rotate(26 236 548)" fill="url(#ribbon)" stroke="#8d1144" stroke-width="1.4"/>
          <circle cx="210" cy="550" r="13" fill="url(#ribbon)" stroke="#8d1144" stroke-width="1.4"/>
          <path d="M212 558 C 196 592 182 616 164 648 C 158 656 170 658 176 652 C 192 626 204 600 218 560 Z" fill="url(#ribbon)" opacity="0.95"/>
          <path d="M208 558 C 224 592 238 616 256 648 C 262 656 250 658 244 652 C 228 626 216 600 202 560 Z" fill="url(#ribbon)" opacity="0.95"/>
        </g>

        <path d="M168 548 C 184 536 200 534 210 535" stroke="#ffd6df" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
      </svg>
      <div class="flower-layer" id="flowerLayer" aria-hidden="true"></div>
    </div>
  </div>

  <footer class="bottom">
    <button class="tap-hint" id="tapHint" type="button"><span class="heart" aria-hidden="true">♥</span> 轻触屏幕，让花盛开</button>
    <p class="after-line" id="afterLine">愿星光与花瓣，都奔向你</p>
  </footer>
</div>

<div class="letter-mask" id="letterMask" aria-hidden="true">
  <div class="letter" role="dialog" aria-modal="true" aria-label="七夕情书">
    <button class="letter-close" id="letterClose" type="button" aria-label="关闭情书">×</button>
    <div class="seal">七夕</div>
    <h3>给 陈维雪</h3>
    <p>维雪：</p>
    <p>遇见你之后，我才知道，<br>喜欢一个人时，连风都是甜的。</p>
    <p>这束花不会凋谢，<br>就像我想一直陪你的那颗心。</p>
    <p>七夕快乐。</p>
    <p class="sign">—— 郑伟</p>
    <div class="replay"><button id="replayBtn" type="button">再看一次花开</button></div>
  </div>
</div>

<script>
var FLOWERS = [
  {
    x: '50%', y: '18%', size: 156, sway: 5.4, delay: 0,
    layers: [
      { cls: 'p-out', count: 8, light: '#ffe4ec', mid: '#ff8fb3', dark: '#d81b60' },
      { cls: 'p-mid', count: 8, offset: 22.5, light: '#ffb8cd', mid: '#ef4d86', dark: '#b11350' },
      { cls: 'p-in', count: 8, offset: 11, light: '#ff8fb3', mid: '#d81b60', dark: '#7c0f3f' }
    ]
  },
  {

var layerEl = document.getElementById('flowerLayer');

function makeFlower(cfg) {
  var pos = document.createElement('div');
  pos.className = 'fpos';
  pos.style.left = cfg.x;
  pos.style.top = cfg.y;

  var flower = document.createElement('div');
  flower.className = 'flower' + (cfg.bud ? ' bud' : '');
  flower.style.setProperty('--size', cfg.size + 'px');
  flower.style.setProperty('--sway', cfg.sway + 's');
  flower.style.animationDelay = '-' + (cfg.delay * 1.7) + 's';

  if (cfg.bud) {
    for (var s = 0; s < 4; s++) {
      var sep = document.createElement('div');
      sep.className = 'sepal';
      sep.style.setProperty('--a', (s * 90 + 45) + 'deg');
      sep.style.setProperty('--d', '0s');
      flower.appendChild(sep);
    }
  }

  cfg.layers.forEach(function (layer) {
    for (var i = 0; i < layer.count; i++) {
      var p = document.createElement('div');
      p.className = 'petal ' + layer.cls;
      var angle = (layer.offset || 0) + i * (360 / layer.count);
      p.style.setProperty('--a', angle + 'deg');
      p.style.setProperty('--light', layer.light);
      p.style.setProperty('--mid', layer.mid);
      p.style.setProperty('--dark', layer.dark);
      p.style.setProperty('--d', (cfg.delay + i * 0.035) + 's');
      flower.appendChild(p);
    }
  });

  if (!cfg.bud) {
    var core = document.createElement('div');
    core.className = 'core';
    core.style.setProperty('--d', (cfg.delay + 0.4) + 's');
    flower.appendChild(core);
  }

  pos.appendChild(flower);
  layerEl.appendChild(pos);
}

FLOWERS.forEach(makeFlower);

var sky = document.getElementById('sky');
var ctx = sky.getContext('2d');
var stars = [];
var shooting = null;
var time = 0;

function initStars() {
  var w = sky.width;
  var h = sky.height;
  var count = Math.min(150, Math.floor((w * h) / 9000));
  stars = [];
  for (var i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.35 + 0.35,
      p: Math.random() * Math.PI * 2,
      s: 0.5 + Math.random() * 1.2,
      a: 0.3 + Math.random() * 0.7
    });
  }
}

function resizeSky() {
  sky.width = window.innerWidth;
  sky.height = window.innerHeight;
  initStars();
}

function drawSky() {
  var w = sky.width;
  var h = sky.height;
  ctx.clearRect(0, 0, w, h);
  time += 0.016;

  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var alpha = s.a * (0.62 + 0.38 * Math.sin(time * s.s + s.p));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 240, 220, ' + alpha + ')';
    ctx.fill();
  }

  if (!shooting && Math.random() < 0.002) {
    shooting = {
      x: Math.random() * w * 0.75,
      y: Math.random() * h * 0.3,
      vx: 7 + Math.random() * 4,
      vy: 2 + Math.random() * 1.6,
      life: 1
    };
  }

  if (shooting) {
    shooting.x += shooting.vx;
    shooting.y += shooting.vy;
    shooting.life -= 0.018;
    if (shooting.life > 0) {
      ctx.strokeStyle = 'rgba(255, 236, 210, ' + (shooting.life * 0.85) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(shooting.x, shooting.y);
      ctx.lineTo(shooting.x - shooting.vx * 7, shooting.y - shooting.vy * 7);
      ctx.stroke();
    } else {
      shooting = null;
    }
  }

  requestAnimationFrame(drawSky);
}

resizeSky();
drawSky();
window.addEventListener('resize', resizeSky);

var bouquet = document.getElementById('bouquet');
var bouquetArea = document.getElementById('bouquetArea');

function fitBouquet() {
  var scale = Math.min(1, bouquetArea.clientWidth / 440, bouquetArea.clientHeight / 700);
  bouquet.style.transform = 'scale(' + Math.max(0.35, scale) + ')';
}

fitBouquet();
window.addEventListener('resize', fitBouquet);

var letterMask = document.getElementById('letterMask');
var letterClose = document.getElementById('letterClose');
var replayBtn = document.getElementById('replayBtn');

function spawnSparkles() {
  var rect = bouquet.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height * 0.26;
  for (var i = 0; i < 20; i++) {
    var el = document.createElement('i');
    el.className = 'spark';
    var angle = (Math.PI * 2 * i) / 20 + Math.random() * 0.4;
    var dist = 60 + Math.random() * 130;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(el);
    (function (node) {
      setTimeout(function () { node.remove(); }, 1100);
    })(el);
  }
}

var petalTimer = null;
var PETAL_COLORS = ['#ff8fb3', '#ffa276', '#e57ba5', '#f4b45f', '#ffb0c5'];

function makeFallingPetal() {
  var el = document.createElement('i');
  el.className = 'falling';
  var w = 10 + Math.random() * 8;
  el.style.width = w + 'px';
  el.style.height = w * (1.12 + Math.random() * 0.3) + 'px';
  el.style.left = Math.random() * 100 + 'vw';
  el.style.background = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
  el.style.setProperty('--dx', (Math.random() * 170 - 85) + 'px');
  el.style.setProperty('--rot', (360 + Math.random() * 540) + 'deg');
  el.style.animationDuration = (6 + Math.random() * 4) + 's';
  el.style.animationDelay = (Math.random() * 1.2) + 's';
  document.body.appendChild(el);
  el.addEventListener('animationend', function () { el.remove(); });
}

function startPetals() {
  for (var i = 0; i < 8; i++) makeFallingPetal();
  petalTimer = setInterval(makeFallingPetal, 520);
}

function bloom() {
  if (document.body.classList.contains('bloomed')) return;
  document.body.classList.add('bloomed');
  spawnSparkles();
  startPetals();
  setTimeout(function () {
    letterMask.classList.add('show');
    letterMask.setAttribute('aria-hidden', 'false');
  }, 2000);
}

document.addEventListener('pointerdown', function (e) {
  if (e.target.closest('.letter-mask')) return;
  if (!document.body.classList.contains('bloomed')) bloom();
});

document.getElementById('tapHint').addEventListener('click', function (e) {
  e.stopPropagation();
  bloom();
});

letterClose.addEventListener('click', function () {
  letterMask.classList.remove('show');
  letterMask.setAttribute('aria-hidden', 'true');
});

replayBtn.addEventListener('click', function () {
  letterMask.classList.remove('show');
  letterMask.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('bloomed');
  clearInterval(petalTimer);
  setTimeout(bloom, 180);
});

if (window.location.hash === '#bloom') {
  setTimeout(bloom, 700);
}
</script>
